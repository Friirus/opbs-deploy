# Déploiement sans accès au dépôt source (celui-ci est privé) : les 5 images versionnées et
# publiées sur GHCR remplacent les 5 `build:` de docker-compose.yml. Fichier autonome plutôt
# qu'un override par-dessus docker-compose.yml — mélanger `build:` et `image:` sur un même service
# ferait reconstruire l'image localement dès qu'elle est absente, au lieu de la tirer du registre,
# ce qui suppose justement le code source qu'un hébergeur tiers n'a pas. Toute autre section
# (postgres, redis, reverse-proxy, variables d'environnement, volumes) est recopiée à l'identique
# de docker-compose.yml : `pnpm check-mirrors` compare les deux fichiers et échoue si l'un ajoute
# une variable que l'autre n'a pas.
#
# Utilisation, depuis le dossier qui porte ce fichier et le .env de l'instance (la racine du dépôt
# de déploiement `opbs-deploy`, ou `infra/` dans le dépôt source) :
#   OPBS_VERSION=1.0.0 docker compose -p opbs -f docker-compose.images.yml --env-file .env up -d
#
# `OPBS_VERSION` doit correspondre à un tag publié par `.github/workflows/release-images.yml`
# (déclenché par un tag git `vX.Y.Z`) ; par défaut `latest` suit la dernière publication sur main.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opbs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opbs}
      POSTGRES_DB: opbs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opbs"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/friirus/opbs-api:${OPBS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://opbs:${POSTGRES_PASSWORD:-opbs}@postgres:5432/opbs?schema=public
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
      JWT_STAFF_SECRET: ${JWT_STAFF_SECRET}
      JWT_CUSTOMER_SECRET: ${JWT_CUSTOMER_SECRET}
      JWT_IMPERSONATION_EXCHANGE_SECRET: ${JWT_IMPERSONATION_EXCHANGE_SECRET}
      JWT_SSO_TICKET_SECRET: ${JWT_SSO_TICKET_SECRET}
      WEB_PORTAL_URL: https://${DOMAIN:-localhost}
      WEB_ADMIN_URL: https://admin.${DOMAIN:-localhost}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-no-reply@example.test}
      EXTENSIONS_DIR: /extensions
      ATTACHMENTS_S3_BUCKET: ${ATTACHMENTS_S3_BUCKET}
      ATTACHMENTS_S3_REGION: ${ATTACHMENTS_S3_REGION:-eu-west-3}
      ATTACHMENTS_S3_ACCESS_KEY_ID: ${ATTACHMENTS_S3_ACCESS_KEY_ID}
      ATTACHMENTS_S3_SECRET_ACCESS_KEY: ${ATTACHMENTS_S3_SECRET_ACCESS_KEY}
      ATTACHMENTS_S3_ENDPOINT_URL: ${ATTACHMENTS_S3_ENDPOINT_URL}
    volumes:
      - ${EXTENSIONS_DIR:-./extensions}:/extensions:ro
    expose:
      - "3001"
    # Publié sur la boucle locale, jamais sur 0.0.0.0 : c'est ce qui permet à un reverse proxy
    # installé sur l'hôte de router vers l'application quand le profil `bundled-proxy` est
    # désactivé. Sans effet quand le Caddy fourni tourne — il joint les conteneurs par le réseau
    # interne du projet, pas par ces ports.
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    image: ghcr.io/friirus/opbs-worker:${OPBS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://opbs:${POSTGRES_PASSWORD:-opbs}@postgres:5432/opbs?schema=public
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-no-reply@example.test}
      IMAP_HOST: ${IMAP_HOST}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_SECURE: ${IMAP_SECURE:-true}
      IMAP_USER: ${IMAP_USER}
      IMAP_PASSWORD: ${IMAP_PASSWORD}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      STATUS_SNAPSHOT_PATH: /snapshot/status.json
      EXTENSIONS_DIR: /extensions
      ATTACHMENTS_S3_BUCKET: ${ATTACHMENTS_S3_BUCKET}
      ATTACHMENTS_S3_REGION: ${ATTACHMENTS_S3_REGION:-eu-west-3}
      ATTACHMENTS_S3_ACCESS_KEY_ID: ${ATTACHMENTS_S3_ACCESS_KEY_ID}
      ATTACHMENTS_S3_SECRET_ACCESS_KEY: ${ATTACHMENTS_S3_SECRET_ACCESS_KEY}
      ATTACHMENTS_S3_ENDPOINT_URL: ${ATTACHMENTS_S3_ENDPOINT_URL}
    volumes:
      - ${EXTENSIONS_DIR:-./extensions}:/extensions:ro
      - status_snapshot:/snapshot
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web-admin:
    image: ghcr.io/friirus/opbs-web-admin:${OPBS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:3001
      WEB_PORTAL_URL: https://${DOMAIN:-localhost}
    expose:
      - "3002"
    ports:
      - "127.0.0.1:3002:3002"

  web-portal:
    image: ghcr.io/friirus/opbs-web-portal:${OPBS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:3001
    expose:
      - "3003"
    ports:
      - "127.0.0.1:3003:3003"

  status-page:
    image: ghcr.io/friirus/opbs-status-page:${OPBS_VERSION:-latest}
    restart: unless-stopped
    volumes:
      - status_snapshot:/snapshot:ro
    expose:
      - "3004"
    ports:
      - "127.0.0.1:3004:3004"

  reverse-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Voir docker-compose.yml : profil activé par défaut via COMPOSE_PROFILES dans .env.example,
    # à vider quand l'hébergeur fournit son propre reverse proxy.
    profiles: ["bundled-proxy"]
    depends_on:
      - api
      - web-admin
      - web-portal
      - status-page
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      TLS_MODE: ${TLS_MODE:-internal}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  status_snapshot:
