# Déploiement sans accès au dépôt source (celui-ci est privé) : les 5 images versionnées et
# publiées sur GHCR remplacent les 5 `build:` de docker-compose.yml. Fichier autonome plutôt
# qu'un override par-dessus docker-compose.yml — mélanger `build:` et `image:` sur un même service
# ferait reconstruire l'image localement dès qu'elle est absente, au lieu de la tirer du registre,
# ce qui suppose justement le code source qu'un hébergeur tiers n'a pas. Toute autre section
# (postgres, redis, reverse-proxy, variables d'environnement, volumes) est recopiée à l'identique
# de docker-compose.yml : `pnpm check-mirrors` compare les deux fichiers et échoue si l'un ajoute
# une variable que l'autre n'a pas.
#
# Utilisation : `bash install.sh` (pose le .env, démarre, affiche le lien d'installation), ou à la
# main, depuis le dossier qui porte ce fichier (la racine du dépôt de déploiement `opbs-deploy`) —
# Compose y lit seul le .env facultatif posé à côté :
#   OPBS_VERSION=1.0.0 docker compose -p opbs -f docker-compose.images.yml up -d
#
# `OPBS_VERSION` doit correspondre à un tag publié par `.github/workflows/release-images.yml`
# (déclenché par un tag git `vX.Y.Z`) ; par défaut `latest` suit la dernière publication sur main.
services:
  # Voir docker-compose.yml : secrets de l'instance générés au premier démarrage, dans deux volumes
  # hors de Postgres ; jamais réécrits, jamais régénérés face à une base existante. En root, sans
  # réseau.
  init-secrets:
    image: ghcr.io/friirus/opbs-api:${OPBS_VERSION:-latest}
    user: "0:0"
    restart: "no"
    network_mode: none
    entrypoint: ["node", "dist/cli/init-secrets.js"]
    # Reprise d'un .env existant : une valeur fournie ici n'initialise qu'un fichier absent.
    environment:
      POSTGRES_PASSWORD:
      CREDENTIALS_ENCRYPTION_KEY:
      JWT_STAFF_SECRET:
      JWT_CUSTOMER_SECRET:
      JWT_IMPERSONATION_EXCHANGE_SECRET:
      JWT_SSO_TICKET_SECRET:
      SETUP_TOKEN:
    volumes:
      - secrets_db:/run/opbs-secrets/db
      - secrets_app:/run/opbs-secrets/app
      - postgres_data:/pgdata:ro

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: opbs
      POSTGRES_PASSWORD_FILE: /run/opbs-secrets/db/postgres_password
      POSTGRES_DB: opbs
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - secrets_db:/run/opbs-secrets/db:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opbs"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/friirus/opbs-api:${OPBS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OPBS_ACCEPT_NEW_CREDENTIALS_KEY:
      WEB_PORTAL_URL: https://${DOMAIN:-localhost}
      WEB_ADMIN_URL: https://admin.${DOMAIN:-localhost}
      # Même dérivation que la route `status.<DOMAIN>` du Caddyfile : lue par les thèmes
      # (`ThemeShellContext.statusPageUrl`) pour un lien de pied de page, jamais par autre chose.
      STATUS_PAGE_URL: https://status.${DOMAIN:-localhost}
      EXTENSIONS_DIR: /extensions
      ATTACHMENTS_S3_BUCKET: ${ATTACHMENTS_S3_BUCKET:-}
      ATTACHMENTS_S3_REGION: ${ATTACHMENTS_S3_REGION:-eu-west-3}
      ATTACHMENTS_S3_ACCESS_KEY_ID: ${ATTACHMENTS_S3_ACCESS_KEY_ID:-}
      ATTACHMENTS_S3_SECRET_ACCESS_KEY: ${ATTACHMENTS_S3_SECRET_ACCESS_KEY:-}
      ATTACHMENTS_S3_ENDPOINT_URL: ${ATTACHMENTS_S3_ENDPOINT_URL:-}
    volumes:
      - ${EXTENSIONS_DIR:-./extensions}:/extensions:ro
      - secrets_db:/run/opbs-secrets/db:ro
      - secrets_app:/run/opbs-secrets/app:ro
    expose:
      - "3001"
    # Publié sur la boucle locale, jamais sur 0.0.0.0 : c'est ce qui permet à un reverse proxy
    # installé sur l'hôte de router vers l'application quand le Caddy fourni est retiré
    # (OPBS_BUNDLED_PROXY=0). Sans effet quand il tourne — il joint les conteneurs par le réseau
    # interne du projet, pas par ces ports.
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    image: ghcr.io/friirus/opbs-worker:${OPBS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_SECURE: ${IMAP_SECURE:-true}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      STATUS_SNAPSHOT_PATH: /snapshot/status.json
      EXTENSIONS_DIR: /extensions
      ATTACHMENTS_S3_BUCKET: ${ATTACHMENTS_S3_BUCKET:-}
      ATTACHMENTS_S3_REGION: ${ATTACHMENTS_S3_REGION:-eu-west-3}
      ATTACHMENTS_S3_ACCESS_KEY_ID: ${ATTACHMENTS_S3_ACCESS_KEY_ID:-}
      ATTACHMENTS_S3_SECRET_ACCESS_KEY: ${ATTACHMENTS_S3_SECRET_ACCESS_KEY:-}
      ATTACHMENTS_S3_ENDPOINT_URL: ${ATTACHMENTS_S3_ENDPOINT_URL:-}
    volumes:
      - ${EXTENSIONS_DIR:-./extensions}:/extensions:ro
      - secrets_db:/run/opbs-secrets/db:ro
      - secrets_app:/run/opbs-secrets/app:ro
      - status_snapshot:/snapshot
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web-admin:
    image: ghcr.io/friirus/opbs-web-admin:${OPBS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:3001
      WEB_PORTAL_URL: https://${DOMAIN:-localhost}
    expose:
      - "3002"
    ports:
      - "127.0.0.1:3002:3002"

  web-portal:
    image: ghcr.io/friirus/opbs-web-portal:${OPBS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:3001
      # Origine du panel, seule autorisée à afficher le portail dans un cadre (aperçu de thème).
      WEB_ADMIN_URL: https://admin.${DOMAIN:-localhost}
    expose:
      - "3003"
    ports:
      - "127.0.0.1:3003:3003"

  status-page:
    image: ghcr.io/friirus/opbs-status-page:${OPBS_VERSION:-latest}
    restart: unless-stopped
    volumes:
      - status_snapshot:/snapshot:ro
    expose:
      - "3004"
    ports:
      - "127.0.0.1:3004:3004"

  reverse-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Voir docker-compose.yml : démarré par défaut, OPBS_BUNDLED_PROXY=0 le retire quand
    # l'hébergeur fournit son propre reverse proxy.
    deploy:
      replicas: ${OPBS_BUNDLED_PROXY:-1}
    depends_on:
      - api
      - web-admin
      - web-portal
      - status-page
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      TLS_MODE: ${TLS_MODE:-internal}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  secrets_db:
  secrets_app:
  redis_data:
  caddy_data:
  caddy_config:
  status_snapshot:
